# Local run: `docker compose up --build`, then open http://localhost:8080
services:
  intent-scorer:
    build:
      context: .
      args:
        VITE_BASE: /
    image: intent-scorer:latest
    ports:
      - "8080:8080"
    environment:
      FRAME_ANCESTORS: "https://badriwhowonders.com https://www.badriwhowonders.com http://localhost:*"
    restart: unless-stopped
